<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reporte Guardia</title>

<style>
body {
    background:#1a1a1b;
    color:white;
    font-family:sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.container {
    background:#2d2d2e;
    padding:20px;
    border-radius:15px;
    text-align:center;
    width:300px;
}

button {
    padding:15px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:10px;
    width:100%;
    font-size:16px;
}

input {
    margin:10px 0;
    width:100%;
}

#status {
    margin-top:15px;
}
</style>
</head>

<body>

<div class="container">
<h2>🛡️ Reporte Guardia</h2>

<input type="file" id="foto" accept="image/*" capture="camera">

<button onclick="enviar()">Enviar Reporte</button>

<p id="status"></p>
</div>

<script>
// 🔥 SOLO CAMBIA TU TOKEN AQUÍ
const TOKEN = "8205258404:AAGc5UfWSKRFyfKmQJaQr9ge4OO0bizZLMo";
const CHAT_ID = "5580335835";

async function enviar() {
    const fileInput = document.getElementById("foto");
    const status = document.getElementById("status");

    if (fileInput.files.length === 0) {
        alert("Toma una foto");
        return;
    }

    status.innerText = "⏳ Enviando...";

    const file = fileInput.files[0];

    navigator.geolocation.getCurrentPosition(async (pos) => {

        try {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;

            const ahora = new Date();

            const texto = `🛡️ REPORTE GUARDIA
📅 ${ahora.toLocaleDateString()}
⏰ ${ahora.toLocaleTimeString()}
📍 https://www.google.com/maps?q=${lat},${lon}`;

            // 📩 Enviar mensaje
            await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                method: "POST",
                headers: {"Content-Type":"application/json"},
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: texto
                })
            });

            // 📷 Enviar foto
            const formData = new FormData();
            formData.append("chat_id", CHAT_ID);
            formData.append("photo", file);

            await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, {
                method: "POST",
                body: formData
            });

            status.innerText = "✅ Enviado a Telegram";

        } catch (err) {
            console.error(err);
            status.innerText = "❌ Error al enviar";
        }

    }, () => {
        status.innerText = "❌ Activa el GPS";
    }, {
        enableHighAccuracy: true,
        timeout: 10000
    });
}
</script>

</body>
</html>
