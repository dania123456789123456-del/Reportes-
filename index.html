<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reporte Guardia</title>

<style>
/* --- ANIMACIÓN DE FONDO --- */
@keyframes moveGradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

body {
    background: linear-gradient(-45deg, #050505, #1a0000, #0f0f0f, #2a0000);
    background-size: 400% 400%;
    animation: moveGradient 15s ease infinite;
    color: #f0f0f0;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    color-scheme: dark;
}

.container {
    background: rgba(18, 18, 18, 0.95);
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    width: 320px;
    box-shadow: 0 0 30px rgba(230, 57, 70, 0.2);
    border: 1px solid #331111;
    border-top: 6px solid #e63946;
    backdrop-filter: blur(10px);
}

.logo-container {
    margin-bottom: 25px;
}
.logo-container img {
    max-width: 160px;
}

/* --- INPUT Y SELECT DARK --- */
input, select {
    margin: 12px 0;
    width: 100%;
    padding: 14px;
    background-color: #1e1e1e !important;
    border: 1px solid #444;
    border-radius: 10px;
    color: #ffffff !important;
    font-weight: bold;
    box-sizing: border-box;
    font-size: 14px;
    transition: 0.3s;
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
}

/* Flecha personalizada para los select */
select {
    background-image: url("data:image/svg+xml;utf8,<svg fill='white' height='20' viewBox='0 0 24 24' width='20' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
    background-repeat: no-repeat;
    background-position: right 10px center;
    background-size: 18px;
    padding-right: 35px;
}

select option {
    background-color: #1a1a1a;
    color: white;
}

input:focus, select:focus {
    outline: none;
    border-color: #ff4d5a;
    box-shadow: 0 0 12px rgba(230, 57, 70, 0.5);
}

#info {
    font-size: 1.1em;
    color: #e63946;
    margin: 10px 0 20px 0;
    text-transform: uppercase;
    font-weight: 800;
}

/* --- BOTÓN ENVIAR --- */
button {
    padding: 16px;
    background: #e63946;
    color: white;
    border: none;
    border-radius: 12px;
    width: 100%;
    font-size: 16px;
    font-weight: 900;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 15px;
    box-shadow: 0 0 15px rgba(230, 57, 70, 0.4);
}

button:active {
    transform: scale(0.98);
}

/* --- BOTÓN TOMAR FOTO --- */
button.photo-btn {
    background: #222;
    border: 1px solid #444;
    margin-top: 10px;
    padding: 14px;
    border-radius: 10px;
    font-weight: bold;
    color: white;
    cursor: pointer;
}

/* --- PREVISUALIZACIÓN FOTO --- */
#preview {
    margin-top: 10px;
    max-width: 100%;
    border-radius: 12px;
    display: none;
}

/* --- STATUS --- */
#status {
    margin-top: 20px;
    font-size: 0.85em;
    color: #4ade80;
}
</style>
</head>

<body>

<div class="container">
    <div class="logo-container">
        <img src="https://i.postimg.cc/j5QtfmVH/Diseno-sin-titulo-20260328-033959-0000.png" alt="Logo">
    </div>

    <input type="number" id="dni" placeholder="INGRESE DNI" onkeyup="buscarDNI()">
    
    <div id="info"></div>

    <select id="unidad"></select>

    <select id="turno">
        <option>Día</option>
        <option>Noche</option>
    </select>

    <input type="file" id="foto" accept="image/*" capture="camera" hidden onchange="mostrarPreview(event)">
    <button type="button" class="photo-btn" onclick="document.getElementById('foto').click()">
        📸 TOMAR FOTO
    </button>
    <img id="preview" alt="Previsualización foto">

    <button onclick="enviar()">ENVIAR REPORTE</button>

    <p id="status"></p>
</div>

<script>
const TOKEN = "8205258404:AAGc5UfWSKRFyfKmQJaQr9ge4OO0bizZLMo";
const CHAT_ID = "5580335835";

const personal = {
  "12345678": { nombre: "Juan Perez", unidad: "Unidad A" },
  "87654321": { nombre: "Pedro Lopez", unidad: "Unidad B" },
  "11112222": { nombre: "Luis Torres", unidad: "Unidad C" }
};

const unidades = ["Unidad A", "Unidad B", "Unidad C", "Unidad D"];

function cargarUnidades() {
    const select = document.getElementById("unidad");
    select.innerHTML = "";
    unidades.forEach(u => {
        const option = document.createElement("option");
        option.value = u; option.textContent = u;
        select.appendChild(option);
    });
}
cargarUnidades();

function buscarDNI() {
    const dni = document.getElementById("dni").value;
    if (personal[dni]) {
        const data = personal[dni];
        document.getElementById("info").innerText = `👤 ${data.nombre}`;
        window.nombre = data.nombre;
    } else {
        document.getElementById("info").innerText = "";
        window.nombre = null;
    }
}

function mostrarPreview(event) {
    const preview = document.getElementById('preview');
    preview.src = URL.createObjectURL(event.target.files[0]);
    preview.style.display = 'block';
}

// Función para poner texto sobre la imagen
async function marcarImagen(file, textoOverlay) {
    return new Promise((resolve) => {
        const img = new Image();
        img.src = URL.createObjectURL(file);
        img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = img.width;
            canvas.height = img.height;
            
            ctx.drawImage(img, 0, 0);
            
            // Estilo del texto
            const fontSize = Math.floor(canvas.width / 25);
            ctx.font = `bold ${fontSize}px Arial`;
            ctx.fillStyle = "yellow";
            ctx.shadowColor = "black";
            ctx.shadowBlur = 7;
            
            // Posición (abajo a la derecha)
            const margin = 20;
            const lines = textoOverlay.split('\n');
            lines.forEach((line, i) => {
                ctx.fillText(line, margin, canvas.height - (lines.length - i) * (fontSize + 5));
            });

            canvas.toBlob((blob) => resolve(blob), 'image/jpeg', 0.8);
        };
    });
}

async function enviar() {
    const unidad = document.getElementById("unidad").value;
    const turno = document.getElementById("turno").value;
    const fileInput = document.getElementById("foto");
    const status = document.getElementById("status");

    if (!window.nombre) { alert("DNI no válido"); return; }
    if (!unidad || !turno) { alert("Seleccione unidad y turno"); return; }
    if (fileInput.files.length === 0) { alert("Toma una foto"); return; }

    status.innerText = "⏳ Procesando y enviando...";
    const file = fileInput.files[0];

    navigator.geolocation.getCurrentPosition(async (pos) => {
        try {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            const ahora = new Date();
            const fechaStr = ahora.toLocaleDateString();
            const horaStr = ahora.toLocaleTimeString();
            
            const infoSello = `FECHA: ${fechaStr}\nHORA: ${horaStr}\nLAT: ${lat}\nLON: ${lon}`;
            const textoTelegram = `🛡️ REPORTE\n👤 ${window.nombre}\n🏢 ${unidad}\n🌙 Turno: ${turno}\n📅 ${fechaStr}\n⏰ ${horaStr}\n📍 https://www.google.com/maps?q=${lat},${lon}`;

            // Procesar imagen con sello
            const fotoMarcadaBlob = await marcarImagen(file, infoSello);

            // --- ENVIAR MENSAJE A TELEGRAM ---
            await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chat_id: CHAT_ID, text: textoTelegram })
            });

            // --- ENVIAR FOTO MARCADA A TELEGRAM ---
            const formData = new FormData();
            formData.append("chat_id", CHAT_ID);
            formData.append("photo", fotoMarcadaBlob, "reporte.jpg");

            await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, {
                method: "POST",
                body: formData
            });

            // --- GUARDAR FOTO MARCADA EN EL DISPOSITIVO ---
            const a = document.createElement('a');
            a.href = URL.createObjectURL(fotoMarcadaBlob);
            a.download = `${window.nombre || 'reporte'}_${fechaStr}.jpg`;
            a.click();

            status.innerText = "✅ Reporte enviado con éxito";
        } catch (err) {
            console.error(err);
            status.innerText = "❌ Error al enviar";
        }
    }, () => {
        status.innerText = "❌ Activa el GPS para enviar";
    });
}
</script>

</body>
</html>
