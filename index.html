<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reporte Guardia</title>

<style>
/* --- ANIMACIÓN DE FONDO --- */
@keyframes moveGradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

body {
    background: linear-gradient(-45deg, #050505, #1a0000, #0f0f0f, #2a0000);
    background-size: 400% 400%;
    animation: moveGradient 15s ease infinite;
    color: #f0f0f0;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    color-scheme: dark;
}

.container {
    background: rgba(18, 18, 18, 0.95);
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    width: 320px;
    box-shadow: 0 0 30px rgba(230, 57, 70, 0.2);
    border: 1px solid #331111;
    border-top: 6px solid #e63946;
    backdrop-filter: blur(10px);
}

.logo-container {
    margin-bottom: 25px;
}
.logo-container img {
    max-width: 160px;
}

input, select {
    margin: 12px 0;
    width: 100%;
    padding: 14px;
    background-color: #1e1e1e !important;
    border: 1px solid #444;
    border-radius: 10px;
    color: #ffffff !important;
    font-weight: bold;
    box-sizing: border-box;
    font-size: 14px;
    transition: 0.3s;
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
}

select {
    background-image: url("data:image/svg+xml;utf8,<svg fill='white' height='20' viewBox='0 0 24 24' width='20' xmlns='http://www.w3.org'><path d='M7 10l5 5 5-5z'/></svg>");
    background-repeat: no-repeat;
    background-position: right 10px center;
    background-size: 18px;
    padding-right: 35px;
}

select option { background-color: #1a1a1a; color: white; }

input:focus, select:focus {
    outline: none;
    border-color: #ff4d5a;
    box-shadow: 0 0 12px rgba(230, 57, 70, 0.5);
}

#info {
    font-size: 1.1em;
    color: #e63946;
    margin: 10px 0 20px 0;
    text-transform: uppercase;
    font-weight: 800;
}

button {
    padding: 16px;
    background: #e63946;
    color: white;
    border: none;
    border-radius: 12px;
    width: 100%;
    font-size: 16px;
    font-weight: 900;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 15px;
}

button.photo-btn {
    background: #222;
    border: 1px solid #444;
    margin-top: 10px;
    padding: 14px;
    border-radius: 10px;
    font-weight: bold;
    color: white;
}

#preview {
    margin-top: 10px;
    max-width: 100%;
    border-radius: 12px;
    display: none;
}

#status { margin-top: 20px; font-size: 0.85em; color: #4ade80; }
</style>
</head>

<body>

<div class="container">
    <div class="logo-container">
        <img src="https://i.postimg.cc" alt="Logo">
    </div>

    <input type="number" id="dni" placeholder="INGRESE DNI" onkeyup="buscarDNI()">
    <div id="info"></div>

    <select id="unidad"></select>
    <select id="turno">
        <option>Día</option>
        <option>Noche</option>
    </select>

    <input type="file" id="foto" accept="image/*" capture="camera" hidden onchange="procesarYMostrarPreview(event)">
    <button type="button" class="photo-btn" onclick="document.getElementById('foto').click()">
        📸 TOMAR FOTO
    </button>
    <img id="preview" alt="Previsualización con datos">

    <button onclick="enviar()">ENVIAR REPORTE</button>
    <p id="status"></p>
</div>

<script>
const TOKEN = "8205258404:AAGc5UfWSKRFyfKmQJaQr9ge4OO0bizZLMo";
const CHAT_ID = "5580335835";

const personal = {
  "12345678": { nombre: "Juan Perez", unidad: "Unidad A" },
  "87654321": { nombre: "Pedro Lopez", unidad: "Unidad B" },
  "11112222": { nombre: "Luis Torres", unidad: "Unidad C" }
};

const unidades = ["Unidad A", "Unidad B", "Unidad C", "Unidad D"];

function cargarUnidades() {
    const select = document.getElementById("unidad");
    select.innerHTML = "";
    unidades.forEach(u => {
        const option = document.createElement("option");
        option.value = u; option.textContent = u;
        select.appendChild(option);
    });
}
cargarUnidades();

function buscarDNI() {
    const dni = document.getElementById("dni").value;
    if (personal[dni]) {
        document.getElementById("info").innerText = `👤 ${personal[dni].nombre}`;
        window.nombre = personal[dni].nombre;
    } else {
        document.getElementById("info").innerText = "";
        window.nombre = null;
    }
}

let fotoFinalBlob = null;
let direccionTexto = "";

async function procesarYMostrarPreview(event) {
    const file = event.target.files[0];
    if (!file) return;

    document.getElementById("status").innerText = "⏳ Obteniendo ubicación...";

    navigator.geolocation.getCurrentPosition(async (pos) => {
        const { latitude: lat, longitude: lon } = pos.coords;
        
        // 1. Obtener dirección real (OpenStreetMap - Gratis)
        try {
            const res = await fetch(`https://nominatim.openstreetmap.org{lat}&lon=${lon}&format=json`);
            const data = await res.json();
            direccionTexto = data.display_name.split(',').slice(0, 3).join(','); // Simplifica la dirección
        } catch (e) {
            direccionTexto = `Lat: ${lat}, Lon: ${lon}`;
        }

        const ahora = new Date();
        const infoSello = {
            fecha: ahora.toLocaleString(),
            direccion: direccionTexto,
            lat, lon
        };

        // 2. Generar imagen con sello y mapa
        fotoFinalBlob = await marcarImagen(file, infoSello);
        
        // 3. Mostrar en la vista previa
        const preview = document.getElementById('preview');
        preview.src = URL.createObjectURL(fotoFinalBlob);
        preview.style.display = 'block';
        document.getElementById("status").innerText = "📸 Foto procesada";
    }, () => {
        alert("Por favor activa el GPS para tomar la foto.");
    });
}

async function marcarImagen(file, info) {
    return new Promise((resolve) => {
        const img = new Image();
        img.src = URL.createObjectURL(file);
        img.onload = async () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // Redimensionar para que no pese demasiado pero se vea bien
            const scale = 1200 / img.width;
            canvas.width = 1200;
            canvas.height = img.height * scale;
            
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            const margin = 30;
            const mapSize = 250;

            // 3. Dibujar Mapa (Static Map de OpenStreetMap)
            const mapImg = new Image();
            mapImg.crossOrigin = "anonymous";
            mapImg.src = `https://static-maps.yandex.ru{info.lon},${info.lat}&size=300,300&z=16&l=map&pt=${info.lon},${info.lat},pm2rdm`;
            
            mapImg.onload = () => {
                // Cuadro blanco de fondo para el mapa
                ctx.fillStyle = "white";
                ctx.fillRect(margin - 5, canvas.height - mapSize - margin - 5, mapSize + 10, mapSize + 10);
                ctx.drawImage(mapImg, margin, canvas.height - mapSize - margin, mapSize, mapSize);

                // 4. Dibujar Texto (Derecha)
                const fontSize = 28;
                ctx.font = `bold ${fontSize}px Arial`;
                ctx.textAlign = "right";
                ctx.fillStyle = "white";
                ctx.shadowColor = "black";
                ctx.shadowBlur = 8;

                const xText = canvas.width - margin;
                let yText = canvas.height - margin - 80;

                ctx.fillText(info.fecha, xText, yText);
                ctx.font = `${fontSize - 4}px Arial`;
                
                // Ajuste de texto para direcciones largas
                const lineasDir = info.direccion.split(',');
                lineasDir.forEach(line => {
                    yText += fontSize + 5;
                    ctx.fillText(line.trim(), xText, yText);
                });

                canvas.toBlob((blob) => resolve(blob), 'image/jpeg', 0.8);
            };
        };
    });
}

async function enviar() {
    const unidad = document.getElementById("unidad").value;
    const turno = document.getElementById("turno").value;
    const status = document.getElementById("status");

    if (!window.nombre || !fotoFinalBlob) { alert("Completa el DNI y la Foto"); return; }

    status.innerText = "🚀 Enviando reporte...";

    try {
        const textoTelegram = `🛡️ REPORTE\n👤 ${window.nombre}\n🏢 ${unidad}\n🌙 Turno: ${turno}\n📍 ${direccionTexto}`;

        await fetch(`https://api.telegram.org{TOKEN}/sendMessage`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ chat_id: CHAT_ID, text: textoTelegram })
        });

        const formData = new FormData();
        formData.append("chat_id", CHAT_ID);
        formData.append("photo", fotoFinalBlob, "reporte.jpg");

        await fetch(`https://api.telegram.org{TOKEN}/sendPhoto`, {
            method: "POST",
            body: formData
        });

        const a = document.createElement('a');
        a.href = URL.createObjectURL(fotoFinalBlob);
        a.download = `Reporte_${window.nombre}.jpg`;
        a.click();

        status.innerText = "✅ ¡Enviado con éxito!";
    } catch (err) {
        status.innerText = "❌ Error al enviar";
    }
}
</script>
</body>
</html>
