<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA DE REPORTE - SEGURIDAD</title>

    <style>
        :root { --primary: #007bff; --success: #28a745; --dark: #1a1a1b; }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--dark);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: #2d2d2e;
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            border-top: 5px solid var(--primary);
        }

        h1 {
            font-size: 20px;
            color: var(--primary);
        }

        .upload-area {
            border: 2px dashed #444;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        input[type="file"] {
            width: 100%;
            margin-top: 10px;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 12px;
            width: 100%;
            font-weight: bold;
        }

        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>🛡️ Reporte Guardia</h1>

    <div class="upload-area">
        <label>Capturar Evidencia:</label>
        <input type="file" id="fotoInput" accept="image/*" capture="camera">
    </div>

    <button id="btnEnviar" class="btn">Confirmar y Enviar</button>

    <div id="status"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby6m13mLSWEXEdKsg4CFSIVKY5mqiJF6FoBZ118efn16zSxrhkqIoK2ge6iuHm5gIzNRw/exec";

const btn = document.getElementById('btnEnviar');
const statusDiv = document.getElementById('status');

btn.addEventListener('click', async () => {

    const fileInput = document.getElementById('fotoInput');

    if (fileInput.files.length === 0) {
        alert("⚠️ Debe tomar una foto");
        return;
    }

    btn.disabled = true;
    btn.innerText = "ENVIANDO...";
    statusDiv.style.display = "block";
    statusDiv.innerHTML = "⏳ Procesando...";
    statusDiv.style.color = "#aaa";

    try {
        const file = fileInput.files[0];

        // 📷 convertir a base64
        const base64 = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
        });

        // 📍 GPS
        navigator.geolocation.getCurrentPosition(async (pos) => {

            const ahora = new Date();

            const datos = {
                fecha: ahora.toLocaleDateString(),
                hora: ahora.toLocaleTimeString(),
                latitud: pos.coords.latitude,
                longitud: pos.coords.longitude,
                mapa_link: `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`,
                foto_base64: base64,
                nombre_archivo: file.name,
                dispositivo: navigator.userAgent
            };

            const respuesta = await fetch(SCRIPT_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(datos)
            });

            const texto = await respuesta.text();
            console.log("RESPUESTA:", texto);

            if (!texto.includes("ok")) {
                throw new Error("Error en servidor");
            }

            statusDiv.innerHTML = "✅ REPORTE GUARDADO EN EXCEL";
            statusDiv.style.color = "#28a745";

            fileInput.value = "";
            btn.innerText = "ENVIAR NUEVO REPORTE";
            btn.disabled = false;

        }, () => {
            statusDiv.innerHTML = "❌ Activa el GPS";
            statusDiv.style.color = "red";
            btn.disabled = false;
        });

    } catch (err) {
        console.error(err);
        statusDiv.innerHTML = "❌ Error real en el envío";
        statusDiv.style.color = "red";
        btn.disabled = false;
        btn.innerText = "REINTENTAR";
    }
});
</script>

</body>
</html>
