<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reporte Guardia</title>

<style>
body {
    background:#1a1a1b;
    color:white;
    font-family:sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.container {
    background:#2d2d2e;
    padding:20px;
    border-radius:15px;
    text-align:center;
    width:300px;
}

button {
    padding:15px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:10px;
    width:100%;
    font-size:16px;
}

input, select {
    margin:10px 0;
    width:100%;
    padding:10px;
}

#status {
    margin-top:15px;
    white-space:pre-line;
}
</style>
</head>

<body>

<div class="container">
<h2>🛡️ Reporte Guardia</h2>

<input type="number" id="dni" placeholder="Ingrese su DNI" onkeyup="buscarDNI()">
<p id="info"></p>

<select id="unidad"></select>

<select id="turno">
<option value="">Seleccionar Turno</option>
<option>Día</option>
<option>Noche</option>
</select>

<input type="file" id="foto" accept="image/*" capture="camera">

<button onclick="enviar()">Enviar Reporte</button>

<p id="status"></p>
</div>

<script>
// 🔥 TOKEN TELEGRAM
const TOKEN = "8205258404:AAGc5UfWSKRFyfKmQJaQr9ge4OO0bizZLMo";
const CHAT_ID = "5580335835";

// 🔥 PERSONAL (EDITAR AQUÍ)
const personal = {
  "12345678": { nombre: "Juan Perez", unidad: "Unidad A" },
  "87654321": { nombre: "Pedro Lopez", unidad: "Unidad B" },
  "11112222": { nombre: "Luis Torres", unidad: "Unidad C" }
};

// 🔥 UNIDADES (EDITAR AQUÍ)
const unidades = [
  "Unidad A",
  "Unidad B",
  "Unidad C",
  "Unidad D"
];

// 🔄 CARGAR UNIDADES
function cargarUnidades() {
    const select = document.getElementById("unidad");

    const op = document.createElement("option");
    op.value = "";
    op.textContent = "Seleccionar Unidad";
    select.appendChild(op);

    unidades.forEach(u => {
        const option = document.createElement("option");
        option.value = u;
        option.textContent = u;
        select.appendChild(option);
    });
}
cargarUnidades();

// 🔍 BUSCAR DNI
function buscarDNI() {
    const dni = document.getElementById("dni").value;

    if (personal[dni]) {
        const data = personal[dni];

        document.getElementById("info").innerText =
            `👤 ${data.nombre}\n🏢 Unidad habitual: ${data.unidad}`;

        window.nombre = data.nombre;

    } else {
        document.getElementById("info").innerText = "❌ DNI no registrado";
        window.nombre = null;
    }
}

// 📤 ENVIAR
async function enviar() {
    const unidad = document.getElementById("unidad").value;
    const turno = document.getElementById("turno").value;
    const fileInput = document.getElementById("foto");
    const status = document.getElementById("status");

    if (!window.nombre) {
        alert("DNI no válido");
        return;
    }

    if (!unidad || !turno) {
        alert("Seleccione unidad y turno");
        return;
    }

    if (fileInput.files.length === 0) {
        alert("Toma una foto");
        return;
    }

    status.innerText = "⏳ Enviando...";

    const file = fileInput.files[0];

    // 💾 GUARDAR FOTO EN DISPOSITIVO
    const url = URL.createObjectURL(file);
    const a = document.createElement("a");
    a.href = url;
    a.download = "reporte.jpg";
    a.click();
    URL.revokeObjectURL(url);

    navigator.geolocation.getCurrentPosition(async (pos) => {

        try {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            const ahora = new Date();

            const texto = `🛡️ REPORTE

🏢 ${unidad}
🌙 Turno: ${turno}
📅 ${ahora.toLocaleDateString()}
⏰ ${ahora.toLocaleTimeString()}
📍 https://www.google.com/maps?q=${lat},${lon}`;

            // 📩 MENSAJE TELEGRAM
            await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                method: "POST",
                headers: {"Content-Type":"application/json"},
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: texto
                })
            });

            // 📷 FOTO TELEGRAM
            const formData = new FormData();
            formData.append("chat_id", CHAT_ID);
            formData.append("photo", file);

            await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, {
                method: "POST",
                body: formData
            });

            status.innerText = "✅ Funcionando: enviado a Telegram y guardado";

        } catch (err) {
            console.error(err);
            status.innerText = "❌ Error al enviar";
        }

    }, () => {
        status.innerText = "❌ Activa el GPS";
    });
}
</script>

</body>
</html>
