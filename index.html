<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reporte Guardia</title>

<style>
@keyframes moveGradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

body {
    background: linear-gradient(-45deg, #050505, #1a0000, #0f0f0f, #2a0000);
    background-size: 400% 400%;
    animation: moveGradient 15s ease infinite;
    color: #f0f0f0;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}

.container {
    background: rgba(18, 18, 18, 0.95);
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    width: 320px;
    box-shadow: 0 0 30px rgba(230, 57, 70, 0.2);
    border: 1px solid #331111;
    border-top: 6px solid #e63946;
    backdrop-filter: blur(10px);
}

.logo-container { margin-bottom: 25px; }
.logo-container img { max-width: 160px; height: auto; }

input, select {
    margin: 12px 0;
    width: 100%;
    padding: 14px;
    background-color: #1e1e1e !important;
    border: 1px solid #444;
    border-radius: 10px;
    color: #ffffff !important;
    font-weight: bold;
    box-sizing: border-box;
    font-size: 14px;
}

#info {
    font-size: 1.1em;
    color: #e63946;
    margin: 10px 0 20px 0;
    text-transform: uppercase;
    font-weight: 800;
}

button {
    padding: 16px;
    background: #e63946;
    color: white;
    border: none;
    border-radius: 12px;
    width: 100%;
    font-size: 16px;
    font-weight: 900;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 15px;
}

.photo-btn {
    background: #222;
    border: 1px solid #444;
    margin-top: 10px;
    padding: 14px;
    border-radius: 10px;
    color: white;
    font-weight: bold;
}

#preview {
    margin-top: 15px;
    max-width: 100%;
    border-radius: 12px;
    display: none;
    border: 2px solid #444;
}

#status { margin-top: 20px; font-size: 0.85em; color: #4ade80; }
</style>
</head>

<body>

<div class="container">
    <div class="logo-container">
        <img src="https://i.postimg.cc" alt="Logo">
    </div>

    <input type="number" id="dni" placeholder="INGRESE DNI" onkeyup="buscarDNI()">
    <div id="info"></div>

    <select id="unidad"></select>
    <select id="turno">
        <option>Día</option>
        <option>Noche</option>
    </select>

    <input type="file" id="foto" accept="image/*" capture="camera" hidden onchange="procesarFoto(event)">
    <button type="button" class="photo-btn" onclick="document.getElementById('foto').click()">
        📸 TOMAR FOTO
    </button>
    
    <canvas id="canvas_aux" style="display:none;"></canvas>
    <img id="preview" alt="Vista previa">

    <button onclick="enviar()">ENVIAR REPORTE</button>
    <p id="status"></p>
</div>

<script>
const TOKEN = "8205258404:AAGc5UfWSKRFyfKmQJaQr9ge4OO0bizZLMo";
const CHAT_ID = "5580335835";

const personal = {
  "12345678": { nombre: "JUAN PEREZ" },
  "87654321": { nombre: "PEDRO LOPEZ" },
  "11112222": { nombre: "LUIS TORRES" }
};

const unidades = ["Unidad A", "Unidad B", "Unidad C", "Unidad D"];

function cargarUnidades() {
    const select = document.getElementById("unidad");
    unidades.forEach(u => {
        const option = document.createElement("option");
        option.value = u; option.textContent = u;
        select.appendChild(option);
    });
}
cargarUnidades();

function buscarDNI() {
    const dni = document.getElementById("dni").value;
    if (personal[dni]) {
        document.getElementById("info").innerText = `👤 ${personal[dni].nombre}`;
        window.nombre = personal[dni].nombre;
    } else {
        document.getElementById("info").innerText = "";
        window.nombre = null;
    }
}

let fotoProcesadaBlob = null;
let direccionGlobal = "Buscando dirección...";

async function procesarFoto(event) {
    const file = event.target.files[0];
    if (!file) return;

    const status = document.getElementById("status");
    status.innerText = "⏳ Obteniendo ubicación y procesando...";

    navigator.geolocation.getCurrentPosition(async (pos) => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;

        try {
            const res = await fetch(`https://nominatim.openstreetmap.org{lat}&lon=${lon}&format=json`);
            const data = await res.json();
            direccionGlobal = data.display_name.split(',').slice(0, 3).join(', ');
        } catch (e) {
            direccionGlobal = `Lat: ${lat.toFixed(4)}, Lon: ${lon.toFixed(4)}`;
        }

        const ahora = new Date();
        const fechaHora = ahora.toLocaleString();

        const img = new Image();
        img.src = URL.createObjectURL(file);
        img.onload = () => {
            const canvas = document.getElementById('canvas_aux');
            const ctx = canvas.getContext('2d');
            
            canvas.width = 1000;
            canvas.height = (img.height * 1000) / img.width;
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            // Dibujar Mapa
            const mapImg = new Image();
            mapImg.crossOrigin = "anonymous";
            mapImg.src = `https://static-maps.yandex.ru{lon},${lat}&size=250,250&z=16&l=map&pt=${lon},${lat},pm2rdm`;
            
            mapImg.onload = () => {
                ctx.fillStyle = "white";
                ctx.fillRect(15, canvas.height - 235, 220, 220);
                ctx.drawImage(mapImg, 20, canvas.height - 230, 210, 210);

                // Dibujar Texto a la derecha
                ctx.fillStyle = "white";
                ctx.shadowColor = "black";
                ctx.shadowBlur = 10;
                ctx.font = "bold 26px Arial";
                ctx.textAlign = "right";
                
                ctx.fillText(fechaHora, canvas.width - 20, canvas.height - 60);
                ctx.font = "20px Arial";
                ctx.fillText(direccionGlobal, canvas.width - 20, canvas.height - 30);

                canvas.toBlob((blob) => {
                    fotoProcesadaBlob = blob;
                    const preview = document.getElementById('preview');
                    preview.src = URL.createObjectURL(blob);
                    preview.style.display = 'block';
                    status.innerText = "✅ Foto lista para enviar";
                }, 'image/jpeg', 0.8);
            };
        };
    }, () => {
        status.innerText = "❌ Error: Activa el GPS";
        alert("Es necesario el GPS para este reporte.");
    });
}

async function enviar() {
    if (!window.nombre || !fotoProcesadaBlob) { 
        alert("Por favor ingrese DNI válido y tome la foto."); 
        return; 
    }

    const status = document.getElementById("status");
    status.innerText = "🚀 Enviando a Telegram...";

    const unidad = document.getElementById("unidad").value;
    const turno = document.getElementById("turno").value;
    const texto = `🛡️ REPORTE\n👤 ${window.nombre}\n🏢 ${unidad}\n🌙 Turno: ${turno}\n📍 ${direccionGlobal}`;

    try {
        await fetch(`https://api.telegram.org{TOKEN}/sendMessage`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ chat_id: CHAT_ID, text: texto })
        });

        const formData = new FormData();
        formData.append("chat_id", CHAT_ID);
        formData.append("photo", fotoProcesadaBlob, "reporte.jpg");

        await fetch(`https://api.telegram.org{TOKEN}/sendPhoto`, {
            method: "POST",
            body: formData
        });

        status.innerText = "✅ Reporte enviado correctamente";
    } catch (e) {
        status.innerText = "❌ Error al enviar";
    }
}
</script>
</body>
</html>
