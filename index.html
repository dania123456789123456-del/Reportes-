<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA DE REPORTE - SEGURIDAD</title>
    <style>
        :root { --primary: #007bff; --success: #28a745; --dark: #1a1a1b; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: var(--dark); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: #2d2d2e; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 90%; max-width: 400px; text-align: center; border-top: 5px solid var(--primary); }
        h1 { font-size: 20px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; color: var(--primary); }
        p { color: #aaa; font-size: 14px; margin-bottom: 25px; }
        .upload-area { border: 2px dashed #444; border-radius: 15px; padding: 20px; margin-bottom: 20px; transition: 0.3s; }
        input[type="file"] { width: 100%; color: #aaa; margin-top: 10px; }
        .btn { background: var(--primary); color: white; border: none; padding: 18px; border-radius: 12px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; text-transform: uppercase; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,123,255,0.3); }
        .btn:active { transform: scale(0.98); background: #0056b3; }
        #status { margin-top: 25px; padding: 15px; border-radius: 8px; font-size: 14px; background: rgba(255,255,255,0.05); display: none; }
        .badge { background: #444; padding: 4px 10px; border-radius: 20px; font-size: 11px; vertical-align: middle; }
    </style>
</head>
<body>

<div class="container">
    <h1>🛡️ Reporte Guardia</h1>
    <p>Control de patrullaje <span class="badge">V1.0</span></p>
    
    <div class="upload-area">
        <label style="display:block; margin-bottom:10px;">Capturar Evidencia:</label>
        <input type="file" id="fotoInput" accept="image/*" capture="camera">
    </div>

    <button id="btnEnviar" class="btn">Confirmar y Enviar</button>
    
    <div id="status"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com";

    const firebaseConfig = {
        apiKey: "AIzaSyAMaspap4-SkY9EywZXAnQWwbzKGs_1oKI",
        authDomain: "reportes-personal.firebaseapp.com",
        projectId: "reportes-personal",
        storageBucket: "reportes-personal.firebasestorage.app",
        messagingSenderId: "924805862598",
        appId: "1:924805862598:web:c256fd54dda444a1eb33c7"
    };

    const IMGBB_API_KEY = "116dcfe2c6a32c3b9d6b5a710170e69a";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const btn = document.getElementById('btnEnviar');
    const statusDiv = document.getElementById('status');

    btn.addEventListener('click', async () => {
        const fileInput = document.getElementById('fotoInput');
        if (fileInput.files.length === 0) return alert("⚠️ Debe tomar una foto para el reporte.");

        btn.disabled = true;
        btn.innerText = "PROCESANDO...";
        statusDiv.style.display = "block";
        statusDiv.innerHTML = "⏳ Obteniendo GPS y subiendo imagen...";
        statusDiv.style.color = "#aaa";

        navigator.geolocation.getCurrentPosition(async (pos) => {
            try {
                // 1. Subir a ImgBB
                const formData = new FormData();
                formData.append("image", fileInput.files[0]);

                const resImg = await fetch(`https://api.imgbb.com{IMGBB_API_KEY}`, {
                    method: "POST",
                    body: formData
                });
                const dataImg = await resImg.json();
                
                if (!dataImg.success) throw new Error("Error en imagen");
                const linkFoto = dataImg.data.url;

                // 2. Guardar en Firestore
                const ahora = new Date();
                await addDoc(collection(db, "reportes_personal"), {
                    fecha: ahora.toLocaleDateString('es-ES'),
                    hora: ahora.toLocaleTimeString('es-ES'),
                    latitud: pos.coords.latitude,
                    longitud: pos.coords.longitude,
                    mapa_link: `https://www.google.com{pos.coords.latitude},${pos.coords.longitude}`,
                    foto_url: linkFoto,
                    dispositivo: navigator.userAgent.substring(0, 50)
                });

                statusDiv.innerHTML = "✅ ENVIADO EXITOSAMENTE<br><small>Ubicación y foto registradas</small>";
                statusDiv.style.color = "#28a745";
                fileInput.value = "";
                btn.innerText = "ENVIAR NUEVO REPORTE";
                btn.disabled = false;
                
            } catch (err) {
                statusDiv.innerHTML = "❌ Error en el envío. Verifique conexión.";
                statusDiv.style.color = "#ff4d4d";
                btn.disabled = false;
                btn.innerText = "REINTENTAR";
            }
        }, (error) => {
            statusDiv.innerHTML = "❌ Error: Debe activar el GPS.";
            statusDiv.style.color = "#ff4d4d";
            btn.disabled = false;
        }, { enableHighAccuracy: true });
    });
</script>

</body>
</html>
