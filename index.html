<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Personal</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 350px; text-align: center; }
        h2 { color: #1a73e8; margin-bottom: 10px; }
        p { color: #5f6368; font-size: 14px; }
        input[type="file"] { margin: 20px 0; font-size: 14px; width: 100%; }
        button { background-color: #1a73e8; color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; }
        button:active { background-color: #174ea6; }
        #estado { margin-top: 20px; font-size: 14px; font-weight: 500; color: #3c4043; }
    </style>
</head>
<body>

<div class="card">
    <h2>Registro Personal</h2>
    <p>Tome la foto para el reporte de hoy</p>
    
    <input type="file" id="fotoInput" accept="image/*" capture="camera">
    <button id="btnEnviar">ENVIAR REPORTE</button>
    
    <div id="estado">Listo para registrar</div>
</div>

<script type="module">
    // CORRECCIÓN: URLs completas de Firebase
    import { initializeApp } from "https://www.gstatic.com";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com";

    const firebaseConfig = {
        apiKey: "AIzaSyAMaspap4-SkY9EywZXAnQWwbzKGs_1oKI",
        authDomain: "reportes-personal.firebaseapp.com",
        projectId: "reportes-personal",
        storageBucket: "reportes-personal.firebasestorage.app",
        messagingSenderId: "924805862598",
        appId: "1:924805862598:web:c256fd54dda444a1eb33c7"
    };

    const IMGBB_API_KEY = "116dcfe2c6a32c3b9d6b5a710170e69a";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('btnEnviar').addEventListener('click', async () => {
        const fileInput = document.getElementById('fotoInput');
        const estado = document.getElementById('estado');

        if (fileInput.files.length === 0) {
            return alert("⚠️ Por favor, tome una foto primero.");
        }

        estado.innerText = "⏳ Procesando reporte y GPS...";
        estado.style.color = "orange";

        navigator.geolocation.getCurrentPosition(async (pos) => {
            try {
                // CORRECCIÓN: Subida a ImgBB
                const formData = new FormData();
                formData.append("image", fileInput.files[0]);

                const resImg = await fetch(`https://api.imgbb.com{IMGBB_API_KEY}`, {
                    method: "POST",
                    body: formData
                });
                const dataImg = await resImg.json();
                
                // CORRECCIÓN: Verificar éxito correctamente
                if (!dataImg.success) throw new Error("Error en ImgBB");
                
                const linkFoto = dataImg.data.url;

                // CORRECCIÓN: Link de Google Maps
                const ahora = new Date();
                await addDoc(collection(db, "reportes_personal"), {
                    fecha: ahora.toLocaleDateString('es-ES'),
                    hora: ahora.toLocaleTimeString('es-ES'),
                    latitud: pos.coords.latitude,
                    longitud: pos.coords.longitude,
                    mapa_link: `https://www.google.com{pos.coords.latitude},${pos.coords.longitude}`,
                    foto_url: linkFoto
                });

                estado.innerHTML = "✅ ¡Reporte enviado con éxito!";
                estado.style.color = "green";
                fileInput.value = ""; 
                
            } catch (err) {
                console.error(err);
                estado.innerText = "❌ Error al enviar. Intente de nuevo.";
                estado.style.color = "red";
            }
        }, (error) => {
            estado.innerText = "❌ Error: Debe activar el GPS.";
            estado.style.color = "red";
        }, { enableHighAccuracy: true });
    });
</script>

</body>
</html>
